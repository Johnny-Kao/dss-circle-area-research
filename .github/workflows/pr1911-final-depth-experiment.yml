name: PR1911 final true-circle depth experiment
on:
  workflow_dispatch:
  push:
    branches: ['research/pr1911-final-diagnostic-selector']
    paths:
      - 'research/monitoring/explore_oir_sliver_depths.py'
      - '.github/workflows/pr1911-final-depth-experiment.yml'
permissions:
  contents: read
jobs:
  slivers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: 55728f7d95c5aaf96f08f515815c4080fe18dd56
          path: monitoring
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - run: python3 research/research/monitoring/stage_oir_circle_for_upstream_ci.py
      - working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Generate actually intersecting true circles at five distinct boundary depths
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: |
          uv run --no-sync python ../research/research/monitoring/explore_oir_sliver_depths.py > /tmp/sliver-fixtures.jsonl
          wc -l /tmp/sliver-fixtures.jsonl
      - name: Independent S2 index differential (Research only)
        run: |
          mkdir oracle-go
          cp research/research/monitoring/differential_s2_cover_oracle.go oracle-go/main.go
          printf 'module pr1911research\n\ngo 1.25.0\n\nrequire github.com/golang/geo v0.0.0-20261106073233-5e8d6967632a\n' > oracle-go/go.mod
          (cd oracle-go && go mod tidy && go run .) < /tmp/sliver-fixtures.jsonl > /tmp/sliver-results.jsonl
      - name: Report root cause and universally informative geometry if it exists
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict
          cases = [json.loads(s) for s in Path('/tmp/sliver-fixtures.jsonl').read_text().splitlines()]
          results = [json.loads(s) for s in Path('/tmp/sliver-results.jsonl').read_text().splitlines()]
          assert len(cases) == len(results)
          counts = defaultdict(lambda:defaultdict(lambda:[0,0]))
          for a,b in zip(cases,results):
              assert a['name']==b['name'] and a['caseIndex']==b['caseIndex']
              assert b['fixed_hit'], (a,b)
              row = counts[a['name']][a['depth']]
              row[0]+=1
              row[1]+=int(not b['old_hit'])
          for name,depths in sorted(counts.items()):
              print('AREA',name,' '.join(f'depth={d}:{v[1]}/{v[0]}' for d,v in sorted(depths.items())))
          for depth in sorted({x['depth'] for x in cases}):
              rows = [v[depth] for v in counts.values() if depth in v]
              print('DEPTH',depth,'areas_old_miss',sum(x[1]>0 for x in rows),'/',len(rows),
                    'total_misses',sum(x[1] for x in rows),'/',sum(x[0] for x in rows))
          print('UNRECOVERED', [k for k,v in sorted(counts.items()) if not any(r[1] for r in v.values())])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1911-sliver-depth-results
          path: |
            /tmp/sliver-fixtures.jsonl
            /tmp/sliver-results.jsonl
          if-no-files-found: ignore
