name: Circle ordinary-size missed-overlap sweep
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/circle_ordinary_sweep_test.go'
      - '.github/workflows/circle-ordinary-sweep.yml'
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/dss
          ref: e97e15eccbe87d114cf85892db6f675e05b93311
          path: dss
      - uses: actions/setup-go@v5
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum
      - name: Scan ordinary city and circle sizes
        run: |
          cp research/research/circle_boundary_research_test.go dss/pkg/models/circle_boundary_research_test.go
          cp research/research/circle_ordinary_sweep_test.go dss/pkg/models/circle_ordinary_sweep_test.go
          cd dss
          go test -v -count=1 -run '^TestResearchOrdinaryRadiusMissFrequency$' ./pkg/models
