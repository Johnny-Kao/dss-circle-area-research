name: PR 1914 monitoring scenario research
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/monitoring/**'
      - '.github/workflows/pr1914-monitoring.yml'
permissions:
  contents: read
jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: main
          path: monitoring
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: monitoring/uv.lock
      - name: Stage proposed scenario in disposable runner
        run: |
          cp research/research/monitoring/oir_circle_overlap.py monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          cp research/research/monitoring/oir_circle_overlap.md monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.md
          python3 - <<'PY'
          from pathlib import Path
          root = Path("monitoring")
          index = root / "monitoring/uss_qualifier/scenarios/astm/utm/dss/__init__.py"
          index.write_text(index.read_text() + "from .oir_circle_overlap import OIRCircleOverlap as OIRCircleOverlap\n")
          ids = root / "monitoring/monitorlib/ids.py"
          original = ids.read_text()
          assert "# Next code: 406" in original
          ids.write_text(original.replace("# Next code: 406", "# Next code: 408", 1))
          PY
          python3 -m py_compile monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
      - name: Install monitoring dependencies
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Ruff format and lint
        working-directory: monitoring
        run: |
          uv run --no-sync ruff format --check monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          uv run --no-sync ruff check monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
      - name: Scenario import and unique resource IDs
        working-directory: monitoring
        run: uv run --no-sync python -c 'from monitoring.uss_qualifier.scenarios.astm.utm.dss import OIRCircleOverlap; print(OIRCircleOverlap.__name__)'
      - name: Validate scenario documentation
        working-directory: monitoring/monitoring/uss_qualifier
        env:
          PYTHONPATH: ../..
        run: ../../.venv/bin/python scenarios/documentation/validate_documentation.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: monitoring-pr1914-research
          path: |
            monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
            monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.md
