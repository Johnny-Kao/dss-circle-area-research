name: PR 1914 Kentland fixture search
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/monitoring/kentland_circle_fixture_test.go'
      - '.github/workflows/pr1914-kentland-fixture.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/dss
          ref: master
          path: dss
      - uses: actions/setup-go@v5
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum
      - name: Search a real old-versus-cap fixture in Kentland
        run: |
          cp research/research/monitoring/kentland_circle_fixture_test.go dss/pkg/models/kentland_circle_fixture_test.go
          gofmt -w dss/pkg/models/kentland_circle_fixture_test.go
          cd dss
          go test -v -count=1 -timeout=15m -run '^TestResearchKentlandCircleOverlapFixture$' ./pkg/models
