name: PR 1914 shifted planning areas fixed DSS regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/monitoring/oir_circle_overlap.*'
      - '.github/workflows/pr1914-monitoring-area-green.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 1, 2, 3, 4]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: main
          path: monitoring
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: Johnny-Kao/dss
          ref: staging/pr-1914-review-final
          path: fixed-dss
      - name: Build fixed DSS image
        run: docker build --tag local/dss:pr1914-fixed fixed-dss
      - name: Stage isolated OIR circle scenario and targeted suite
        run: |
          cp research/research/monitoring/oir_circle_overlap.py monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/
          cp research/research/monitoring/oir_circle_overlap.md monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/__init__.py")
          p.write_text(p.read_text() + "from .oir_circle_overlap import OIRCircleOverlap as OIRCircleOverlap\n")
          ids=Path("monitoring/monitoring/monitorlib/ids.py")
          ids.write_text(ids.read_text().replace("# Next code: 406","# Next code: 408",1))
          p=Path("monitoring/monitoring/uss_qualifier/suites/astm/utm/dss_circle_overlap.yaml")
          p.write_text("""name: DSS circular overlap regression
          resources:
            dss: resources.astm.f3548.v21.DSSInstanceResource
            id_generator: resources.interuss.IDGeneratorResource
            planning_area: resources.PlanningAreaResource
          actions:
            - test_scenario:
                scenario_type: scenarios.astm.utm.dss.OIRCircleOverlap
                resources:
                  dss: dss
                  id_generator: id_generator
                  planning_area: planning_area
          """)
          config=Path("monitoring/monitoring/uss_qualifier/configurations/dev/f3548_self_contained.yaml")
          original=config.read_text().replace("suite_type: suites.astm.utm.f3548_21","suite_type: suites.astm.utm.dss_circle_overlap",1)
          original=original.replace("          id_generator: id_generator\n", "          id_generator: id_generator\n          planning_area: planning_area\n", 1)
          assert "  validation:\n" in original
          original=original.split("  validation:\n",1)[0]
          original += "  validation:\n    criteria:\n      - applicability:\n          test_scenarios: {}\n        pass_condition:\n          each_element:\n            has_execution_error: false\n      - applicability:\n          failed_checks:\n            has_severity:\n              higher_than: Low\n        pass_condition:\n          elements:\n            count:\n              equal_to: 0\n"
          config.write_text(original)
          PY
      - name: Relocate default Planning Area using original 10 km cascade offsets
        env:
          AREA_OFFSET: ${{ matrix.offset }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          p = Path("monitoring/monitoring/uss_qualifier/configurations/dev/f3548_self_contained.yaml")
          s = p.read_text()
          a = s.index("        planning_area_volume:\n")
          b = s.index("        planning_area:\n", a)
          block = s[a:b]
          offset = int(os.environ["AREA_OFFSET"])
          east_m, north_m = [(0, 0), (10000, 0), (0, -10000), (-10000, 0), (0, 10000)][offset]
          # Same directions/margins used by the existing cascade resource.
          lat_delta = north_m / 111195
          lng_delta = east_m / (111195 * 0.797)
          block = re.sub(r"lat: (-?\d+\.\d+)", lambda m: f"lat: {float(m[1])+lat_delta:.9f}", block)
          block = re.sub(r"lng: (-?\d+\.\d+)", lambda m: f"lng: {float(m[1])+lng_delta:.9f}", block)
          p.write_text(s[:a] + block + s[b:])
          print(f"planning area cascade index={offset}, east={east_m}m north={north_m}m")
          PY
      - name: Verify fixed DSS passes all five 4D controls
        working-directory: monitoring
        env:
          CONFIG_NAME: configurations.dev.f3548_self_contained
          CI: 'true'
          DSS_IMAGE: local/dss:pr1914-fixed
        run: make -C monitoring/uss_qualifier test
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kentland-monitoring-api-reports
          path: |
            monitoring/monitoring/uss_qualifier/output
            monitoring/logs
            monitoring/monitoring/mock_uss/output
          if-no-files-found: ignore
