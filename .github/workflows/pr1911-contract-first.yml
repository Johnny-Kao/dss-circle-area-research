name: PR1911 contract-first fixture research
on:
  workflow_dispatch:
  push:
    branches: ['research/pr1911-contract-first-fixture', 'research/pr1911-diagnostic-design']
    paths:
      - 'research/monitoring/oir_circle_overlap_contract_first.py'
      - 'research/monitoring/scan_contract_first_coverage.py'
      - '.github/workflows/pr1911-contract-first.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: main
          path: monitoring
      - uses: astral-sh/setup-uv@v6
      - name: Stage research-only fixture in disposable Monitoring checkout
        run: |
          cp research/research/monitoring/oir_circle_overlap_review.py monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap_review.py
          cp research/research/monitoring/oir_circle_overlap_contract_first.py monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path("monitoring/monitoring")
          idx = root / "uss_qualifier/scenarios/astm/utm/dss/__init__.py"
          idx.write_text(idx.read_text() + "from .oir_circle_overlap import OIRCircleOverlap as OIRCircleOverlap\n")
          ids = root / "monitorlib/ids.py"
          ids.write_text(ids.read_text().replace("# Next code: 406", "# Next code: 408", 1))
          PY
      - name: Install Monitoring dependencies
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Verify geometry and area portability
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: uv run --no-sync python ../research/research/monitoring/scan_contract_first_coverage.py
      - name: Syntax and quality
        working-directory: monitoring
        run: |
          uv run --no-sync python -m compileall -q monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          uv run --no-sync ruff check monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
