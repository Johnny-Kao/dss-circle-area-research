name: PR1911 true-circle S2 corner diagnostic coverage (research)
on:
  workflow_dispatch:
  push:
    branches: ['research/pr1911-corner-coverage-solution']
    paths:
      - 'research/monitoring/export_oir_circle_v3_corner_candidates.py'
      - 'research/monitoring/oir_circle_overlap_standalone.py'
      - '.github/workflows/pr1911-v3-corner-coverage.yml'
permissions:
  contents: read
jobs:
  corner-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: 55728f7d95c5aaf96f08f515815c4080fe18dd56
          path: monitoring
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Stage candidate only inside disposable Monitoring checkout
        run: python3 research/research/monitoring/stage_oir_circle_for_upstream_ci.py
      - name: Install locked Monitoring dependencies
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Enumerate valid true-circle S2 corner overlaps
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: |
          uv run --no-sync python ../research/research/monitoring/export_oir_circle_v3_corner_candidates.py > /tmp/corner-fixtures.jsonl
          wc -l /tmp/corner-fixtures.jsonl
      - name: Differential test against old/fixed S2 index (Research only)
        run: |
          mkdir oracle-go
          cp research/research/monitoring/differential_s2_cover_oracle.go oracle-go/main.go
          printf 'module pr1911research\n\ngo 1.25.0\n\nrequire github.com/golang/geo v0.0.0-20261106073233-5e8d6967632a\n' > oracle-go/go.mod
          (cd oracle-go && go mod tidy && go run .) < /tmp/corner-fixtures.jsonl > /tmp/corner-results.jsonl
      - name: Prove geographic robustness and report simplest common corner parameters
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          cases=[json.loads(line) for line in Path('/tmp/corner-fixtures.jsonl').read_text().splitlines()]
          results=[json.loads(line) for line in Path('/tmp/corner-results.jsonl').read_text().splitlines()]
          assert len(cases)==len(results)
          summary=defaultdict(lambda:[0,0,0])
          choices=defaultdict(lambda:defaultdict(lambda:[0,0]))
          first={}
          for case,result in zip(cases,results):
              name=case['name']
              assert result['name']==name and result['caseIndex']==case['caseIndex']
              assert result['fixed_hit'], f"Invalid geometry: {case}"
              row=summary[name]
              row[0]+=1
              row[1]+=int(not result['old_hit'])
              row[2]+=1
              key=(case['radius'],case['depth'],case['queryOffset'])
              choice=choices[key][name]
              choice[0]+=1
              choice[1]+=int(not result['old_hit'])
              if not result['old_hit'] and name not in first:
                  first[name]=case
          for name,(total,miss,valid) in sorted(summary.items()):
              print(f"{name}: valid={total}, old-miss/fixed-hit={miss}, fixed-hits={valid}")
              if name in first:
                  print(f"  example={first[name]}")
          required={'Kentland','Stanford','Tokyo','Zurich','Helsinki'}
          print(f"ALL_REGIONS_DIAGNOSTIC={set(first)==required}")
          assert set(summary)==required
          for key,area in sorted(choices.items()):
              covered=[name for name,c in area.items() if c[1]>0]
              print(f"radius={key[0]} depth={key[1]} offset={key[2]}: diagnostic={covered}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1911-v3-true-corner-evidence
          path: |
            /tmp/corner-fixtures.jsonl
            /tmp/corner-results.jsonl
          if-no-files-found: ignore
