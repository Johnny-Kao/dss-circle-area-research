name: PR1911 v2 boundary edge exploration (Research only)
on:
  workflow_dispatch:
  push:
    branches: ['research/pr1911-circle-boundary-v2-validation']
    paths:
      - 'research/monitoring/export_oir_circle_v2_edge_exploration.py'
      - 'research/monitoring/export_oir_circle_v2_grid_scan.py'
      - 'research/monitoring/export_oir_circle_v2_parameter_scan.py'
      - '.github/workflows/pr1911-v2-edge-exploration.yml'
permissions:
  contents: read
jobs:
  candidate-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: 55728f7d95c5aaf96f08f515815c4080fe18dd56
          path: monitoring
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Stage v2 Scenario only in disposable Monitoring checkout
        run: python3 research/research/monitoring/stage_oir_circle_for_upstream_ci.py
      - name: Install locked Monitoring dependencies
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Export all four real S2 edges at 3 offsets in 5 Planning Areas
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: |
          uv run --no-sync python ../research/research/monitoring/export_oir_circle_v2_edge_exploration.py > /tmp/v2-edges.jsonl
          wc -l /tmp/v2-edges.jsonl
      - name: Run separate independent historical S2 oracle for research evidence
        run: |
          mkdir oracle-go
          cp research/research/monitoring/differential_s2_cover_oracle.go oracle-go/main.go
          printf 'module pr1911research\n\ngo 1.25.0\n\nrequire github.com/golang/geo v0.0.0-20261106073233-5e8d6967632a\n' > oracle-go/go.mod
          (cd oracle-go && go mod tidy && go run .) < /tmp/v2-edges.jsonl > /tmp/v2-results.jsonl
      - name: Summarize old-miss/fixed-hit by area, edge and offset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=[json.loads(x) for x in Path('/tmp/v2-edges.jsonl').read_text().splitlines()]
          results=[json.loads(x) for x in Path('/tmp/v2-results.jsonl').read_text().splitlines()]
          assert len(source)==len(results)
          assert source
          for area in sorted({x['name'] for x in source}):
              grouped=[(x,y) for x,y in zip(source,results) if x['name']==area]
              miss=[(x['edge'], x['fraction']) for x,y in grouped if not y['old_hit'] and y['fixed_hit']]
              print(f"{area}: candidates={len(grouped)} diagnostic={len(miss)}")
              print(f"  old-miss edges/positions: {miss}")
              assert all(y['fixed_hit'] for x,y in grouped), area
          PY
      - name: Explore multiple starting cells with unmodified v2 single-fixture code
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: |
          uv run --no-sync python ../research/research/monitoring/export_oir_circle_v2_grid_scan.py > /tmp/v2-grid.jsonl
          wc -l /tmp/v2-grid.jsonl
      - name: Run independent old/fixed oracle on starting-cell scan
        run: (cd oracle-go && go run .) < /tmp/v2-grid.jsonl > /tmp/v2-grid-results.jsonl
      - name: Report whether grid-only selection can recover diagnostic positions
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          counts=defaultdict(lambda:[0,0,0])
          for line in Path('/tmp/v2-grid-results.jsonl').read_text().splitlines():
              item=json.loads(line)
              row=counts[item['name']]
              row[0]+=1
              row[1]+=int(not item['old_hit'] and item['fixed_hit'])
              row[2]+=int(item['fixed_hit'])
          for area,(all_cases,diagnostic,fixed) in sorted(counts.items()):
              print(f"{area}: grid_cells={all_cases}, old-miss/fixed-hit={diagnostic}, fixed-hit={fixed}")
              assert fixed==all_cases, area
          assert set(counts)=={'Kentland','Stanford','Tokyo','Zurich','Helsinki'}
          PY
      - name: Scan radius and crossing-depth combinations with unmodified v2 fixture
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: |
          uv run --no-sync python ../research/research/monitoring/export_oir_circle_v2_parameter_scan.py > /tmp/v2-parameters.jsonl
          wc -l /tmp/v2-parameters.jsonl
      - name: Compare all parameter candidates independently against old/fixed S2
        run: (cd oracle-go && go run .) < /tmp/v2-parameters.jsonl > /tmp/v2-parameter-results.jsonl
      - name: Identify parameter combinations that are diagnostic in every area
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          sources=[json.loads(x) for x in Path('/tmp/v2-parameters.jsonl').read_text().splitlines()]
          results=[json.loads(x) for x in Path('/tmp/v2-parameter-results.jsonl').read_text().splitlines()]
          assert len(sources)==len(results)
          areas={s['name'] for s in sources}
          matrix=defaultdict(dict)
          for a,b in zip(sources,results):
              assert a['name']==b['name'] and a['caseIndex']==b['caseIndex']
              assert b['fixed_hit'], a
              matrix[(a['radius'],a['depth'])][a['name']]=not b['old_hit']
          for (r,d),rows in sorted(matrix.items()):
              print(f"radius={r:g}m depth={d:g}m old_miss={sum(rows.values())}/{len(areas)} regions: {rows}")
          full=[(r,d) for (r,d),v in matrix.items() if len(v)==len(areas) and all(v.values())]
          print(f"DIAGNOSTIC_ALL_FIVE={full}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1911-v2-edge-exploration
          path: |
            /tmp/v2-edges.jsonl
            /tmp/v2-results.jsonl
            /tmp/v2-grid.jsonl
            /tmp/v2-grid-results.jsonl
            /tmp/v2-parameters.jsonl
            /tmp/v2-parameter-results.jsonl
          if-no-files-found: ignore
