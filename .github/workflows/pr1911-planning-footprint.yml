name: PR1911 PlanningArea footprint contract
on:
  workflow_dispatch:
  push:
    branches: ['research/pr1911-review-revision', 'research/pr1911-direct-s2-boundary']
    paths:
      - 'research/monitoring/oir_circle_overlap_review.py'
      - 'research/monitoring/test_planning_footprint.py'
      - '.github/workflows/pr1911-planning-footprint.yml'
permissions:
  contents: read
jobs:
  footprint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: main
          path: monitoring
      - uses: astral-sh/setup-uv@v6
      - name: Stage reviewed scenario in disposable checkout
        run: |
          cp research/research/monitoring/oir_circle_overlap_review.py monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path("monitoring/monitoring")
          index=root/"uss_qualifier/scenarios/astm/utm/dss/__init__.py"
          index.write_text(index.read_text()+"from .oir_circle_overlap import OIRCircleOverlap as OIRCircleOverlap\n")
          ids=root/"monitorlib/ids.py"
          ids.write_text(ids.read_text().replace("# Next code: 406","# Next code: 408",1))
          PY
      - name: Install Monitoring dependencies
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Actual footprint unit regressions
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: uv run --no-sync python ../research/research/monitoring/test_planning_footprint.py
