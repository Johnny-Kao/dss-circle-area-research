name: PR1911 full S2 edge true-circle coverage (research)
on:
  workflow_dispatch:
  push:
    branches: ['research/pr1911-corner-coverage-solution']
    paths:
      - 'research/monitoring/export_oir_circle_v3_full_edge.py'
      - '.github/workflows/pr1911-v3-full-edge.yml'
permissions:
  contents: read
jobs:
  full-edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: 55728f7d95c5aaf96f08f515815c4080fe18dd56
          path: monitoring
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Stage current scenario in disposable Monitoring checkout
        run: python3 research/research/monitoring/stage_oir_circle_for_upstream_ci.py
      - name: Install locked Monitoring dependencies
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Find 5-region true-circle edge candidates independent of old polygon
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: |
          uv run --no-sync python ../research/research/monitoring/export_oir_circle_v3_full_edge.py > /tmp/full-edge-fixtures.jsonl
          wc -l /tmp/full-edge-fixtures.jsonl
      - name: Compare independent real old and fixed S2 coverings (Research only)
        run: |
          mkdir oracle-go
          cp research/research/monitoring/differential_s2_cover_oracle.go oracle-go/main.go
          printf 'module pr1911research\n\ngo 1.25.0\n\nrequire github.com/golang/geo v0.0.0-20261106073233-5e8d6967632a\n' > oracle-go/go.mod
          (cd oracle-go && go mod tidy && go run .) < /tmp/full-edge-fixtures.jsonl > /tmp/full-edge-results.jsonl
      - name: Summarize first diagnostic case and area coverage
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          cases=[json.loads(s) for s in Path('/tmp/full-edge-fixtures.jsonl').read_text().splitlines()]
          results=[json.loads(s) for s in Path('/tmp/full-edge-results.jsonl').read_text().splitlines()]
          assert len(cases)==len(results)
          counts=defaultdict(lambda:[0,0])
          first={}
          by_edge=defaultdict(lambda:defaultdict(lambda:[0,0]))
          for a,b in zip(cases,results):
              assert a['name']==b['name'] and a['caseIndex']==b['caseIndex']
              assert b['fixed_hit'],f"Real overlap should always be found by patched covering: {a}"
              n=a['name']
              counts[n][0]+=1
              miss=not b['old_hit']
              counts[n][1]+=int(miss)
              by_edge[n][a['edge']][0]+=1
              by_edge[n][a['edge']][1]+=int(miss)
              if miss and n not in first:first[n]=a
          for n,(total,miss) in sorted(counts.items()):
              print(f"{n}: tested={total} diagnostic_old_miss={miss} first={first.get(n)}")
              print(f"  edge split={dict(by_edge[n])}")
              print(f"  first4={sum(not b['old_hit'] for a,b in zip(cases,results) if a['name']==n and a['caseIndex']<4)} first16={sum(not b['old_hit'] for a,b in zip(cases,results) if a['name']==n and a['caseIndex']<16)}")
          print(f"ALL_FIVE={set(first)=={'Kentland','Stanford','Tokyo','Zurich','Helsinki'}}")
          assert set(counts)=={'Kentland','Stanford','Tokyo','Zurich','Helsinki'}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1911-full-edge-data
          path: |
            /tmp/full-edge-fixtures.jsonl
            /tmp/full-edge-results.jsonl
          if-no-files-found: ignore
