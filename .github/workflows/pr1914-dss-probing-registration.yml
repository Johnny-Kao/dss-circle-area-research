name: PR 1914 official DSS probing registration
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/monitoring/patch_dss_probing.py'
      - '.github/workflows/pr1914-dss-probing-registration.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: main
          path: monitoring
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - name: Install existing project validation tools
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Register new scenario in the real DSS probing suite
        run: |
          cp research/research/monitoring/oir_circle_overlap.py monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/
          cp research/research/monitoring/oir_circle_overlap.md monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/
          python3 research/research/monitoring/patch_dss_probing.py monitoring
          python3 - <<'PY'
          from pathlib import Path
          p=Path("monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/__init__.py")
          p.write_text(p.read_text()+"from .oir_circle_overlap import OIRCircleOverlap as OIRCircleOverlap\n")
          p=Path("monitoring/monitoring/monitorlib/ids.py")
          p.write_text(p.read_text().replace("# Next code: 406","# Next code: 408",1))
          PY
      - name: Verify official suite contains scenario and resource mapping
        working-directory: monitoring
        run: |
          uv run --no-sync python - <<'PY'
          import yaml
          from pathlib import Path
          from monitoring.uss_qualifier.scenarios.astm.utm.dss import OIRCircleOverlap
          path=Path("monitoring/uss_qualifier/suites/astm/utm/dss_probing.yaml")
          doc=yaml.safe_load(path.read_text())
          scenario=[x["test_scenario"] for x in doc["actions"] if "test_scenario" in x and x["test_scenario"]["scenario_type"]=="scenarios.astm.utm.dss.OIRCircleOverlap"]
          assert len(scenario)==1
          assert scenario[0]["resources"]=={"dss":"dss","id_generator":"id_generator","planning_area":"planning_area"}
          assert all(k in doc["resources"] for k in scenario[0]["resources"])
          print(f"Official dss_probing suite registered {OIRCircleOverlap.__name__}; mapping valid.")
          PY
          uv run --no-sync python -m compileall -q monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          (cd monitoring/uss_qualifier && PYTHONPATH=../.. ../../.venv/bin/python scenarios/documentation/validate_documentation.py)
