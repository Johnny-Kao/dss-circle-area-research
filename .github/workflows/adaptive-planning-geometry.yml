name: Research adaptive real Monitoring PlanningArea shapes
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/monitoring/oir_circle_overlap_adaptive.py'
      - 'research/monitoring/adaptive_real_planning_geometry.py'
      - '.github/workflows/adaptive-planning-geometry.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: main
          path: monitoring
      - uses: astral-sh/setup-uv@v6
      - name: Stage adaptive scenario in isolated checkout
        run: |
          cp research/research/monitoring/oir_circle_overlap_adaptive.py monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/__init__.py")
          p.write_text(p.read_text()+"from .oir_circle_overlap import OIRCircleOverlap as OIRCircleOverlap\n")
          p=Path("monitoring/monitoring/monitorlib/ids.py")
          p.write_text(p.read_text().replace("# Next code: 406","# Next code: 408",1))
          PY
      - name: Install project dependencies
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Code lint and Python real shape matrix
        working-directory: monitoring
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff check monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          uv run --no-sync ruff format --check monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          uv run --no-sync python ../research/research/monitoring/adaptive_real_planning_geometry.py | tee ../planning-shapes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-real-planning-shapes
          path: planning-shapes.log
          if-no-files-found: ignore
