name: PR 1914 shifted S2 covering fixture discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/monitoring/shifted_covering_fixtures_test.go'
      - '.github/workflows/pr1914-shifted-fixture-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/dss
          ref: master
          path: dss
      - uses: actions/setup-go@v5
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum
      - name: Search real old-versus-cap fixtures across three planning areas
        run: |
          cp research/research/monitoring/shifted_covering_fixtures_test.go dss/pkg/models/shifted_covering_fixtures_test.go
          gofmt -w dss/pkg/models/shifted_covering_fixtures_test.go
          cd dss
          go test -v -count=1 -timeout=15m -run '^TestResearchShiftedCoveringFixtures$' ./pkg/models
