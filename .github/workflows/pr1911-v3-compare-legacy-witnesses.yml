name: PR1911 compare established diagnostic fixtures vs simple circle (Research)
on:
  workflow_dispatch:
  push:
    branches: ['research/pr1911-corner-coverage-solution']
    paths:
      - '.github/workflows/pr1911-v3-compare-legacy-witnesses.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: Johnny-Kao/dss-circle-area-research
          ref: research/pr1911-upstream-ci-triage
          path: legacy
      - uses: actions/checkout@v4
        with:
          repository: interuss/monitoring
          ref: 55728f7d95c5aaf96f08f515815c4080fe18dd56
          path: monitoring
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Place established Research scenario in disposable Monitoring copy
        run: |
          cp legacy/research/monitoring/oir_circle_overlap_standalone.py monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/oir_circle_overlap.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('monitoring/monitoring/uss_qualifier/scenarios/astm/utm/dss/__init__.py')
          line='from .oir_circle_overlap import OIRCircleOverlap as OIRCircleOverlap\n'
          anchor='from .oir_explicit_sub_handling import OIRExplicitSubHandling as OIRExplicitSubHandling\n'
          assert p.read_text().count(anchor)==1
          p.write_text(p.read_text().replace(anchor,line+anchor))
          PY
      - name: Install locked dependencies
        working-directory: monitoring
        run: uv sync --locked --no-install-project --group dev
      - name: Export actual established old Research fixtures
        working-directory: monitoring
        env:
          PYTHONPATH: .
        run: uv run --no-sync python ../legacy/research/monitoring/export_oir_circle_fixtures.py > /tmp/legacy-fixtures.jsonl
      - name: Independently evaluate established fixtures against old and fixed indexes
        run: |
          mkdir oracle-go
          cp research/research/monitoring/differential_s2_cover_oracle.go oracle-go/main.go
          printf 'module pr1911research\n\ngo 1.25.0\n\nrequire github.com/golang/geo v0.0.0-20261106073233-5e8d6967632a\n' > oracle-go/go.mod
          (cd oracle-go && go mod tidy && go run .) < /tmp/legacy-fixtures.jsonl > /tmp/legacy-results.jsonl
      - name: Print verified existing Stanford witnesses and dimensions
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          inputs=[json.loads(s) for s in Path('/tmp/legacy-fixtures.jsonl').read_text().splitlines()]
          output=[json.loads(s) for s in Path('/tmp/legacy-results.jsonl').read_text().splitlines()]
          counts=defaultdict(lambda:[0,0])
          for a,b in zip(inputs,output):
              counts[a['name']][0]+=1
              counts[a['name']][1]+=int(not b['old_hit'] and b['fixed_hit'])
              if a['name']=='Stanford':
                  print('STANFORD_WITNESS',a,'old_hit',b['old_hit'],'fixed_hit',b['fixed_hit'])
          print('SUMMARY',dict(counts))
          assert all(total==miss for total,miss in counts.values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1911-legacy-exact-fixtures
          path: |
            /tmp/legacy-fixtures.jsonl
            /tmp/legacy-results.jsonl
          if-no-files-found: ignore
