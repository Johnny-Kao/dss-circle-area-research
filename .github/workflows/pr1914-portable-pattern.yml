name: PR 1914 portable S2 geometry discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/monitoring/portable_pattern_test.go'
      - '.github/workflows/pr1914-portable-pattern.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: interuss/dss
          ref: master
          path: dss
      - uses: actions/setup-go@v5
        with:
          go-version-file: dss/go.mod
          cache-dependency-path: dss/go.sum
      - name: Find one relative geometry across five planning areas
        run: |
          cp research/research/monitoring/portable_pattern_test.go dss/pkg/models/portable_pattern_test.go
          gofmt -w dss/pkg/models/portable_pattern_test.go
          cd dss
          go test -v -count=1 -timeout=25m -run '^TestFindPortableCirclePattern$' ./pkg/models
